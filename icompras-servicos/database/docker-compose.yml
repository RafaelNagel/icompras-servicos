version: '3.9'

services:
  postgres:
    image: postgres:17.4
    container_name: db_i_compras
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LittleShoe12@
      POSTGRES_MULTIPLE_DATABASE: icomprasprodutos, icompraspedidos, icomprasclientes
    ports:
      -   "5555:5432"
    volumes:
      - ./data:/var/lib/postgresql/data